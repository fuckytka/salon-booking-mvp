name: Salon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: API and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run API integration tests
        run: python -m unittest discover -s tests -p 'test_api.py' -v
      - name: Install Chromium for Playwright
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run booking flow in Chromium
        run: python tests/browser_checks.py --screens ci-screens
      - name: Save browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: booking-screenshots
          path: ci-screens/*.png
          if-no-files-found: ignore
          retention-days: 14
